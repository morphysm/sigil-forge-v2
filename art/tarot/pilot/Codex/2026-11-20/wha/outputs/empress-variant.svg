<svg xmlns="http://www.w3.org/2000/svg" width="240" height="360" viewBox="0 0 240 360" role="img" aria-labelledby="title description">
  <title id="title">The Empress</title>
  <desc id="description">A neon-green figure reclines on a throne with a raised scepter, a crown of stars, wheat, and a heart-shaped Venus shield.</desc>
  <rect width="240" height="360" fill="#000000"/>

  <g id="throne" fill="none" stroke="#F8F4E7" stroke-width="3.5" stroke-linejoin="bevel">
