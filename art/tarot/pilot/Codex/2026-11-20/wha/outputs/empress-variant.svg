  </g>
  <path id="stars" fill="#F8F4E7" d="M89 102 91 106 95 108 91 110 89 114 87 110 83 108 87 106Z M101 94 103 99 108 101 103 103 101 108 99 103 94 101 99 99Z M113 102 115 106 119 108 115 110 113 114 111 110 107 108 111 106Z"/>

  <g id="wheat" fill="none" stroke="#F8F4E7" stroke-width="3.5" stroke-linejoin="bevel">
    <path d="M47 249 49 198 47 190 M48 225 39 216 38 208 M48 221 57 212 58 204 M49 212 42 204 41 198 M49 208 55 201 56 194"/>
    <path d="M197 214 195 171 197 162 M196 203 187 195 185 187 M196 198 204 189 205 181 M195 189 188 181 187 174 M195 185 202 177 203 170"/>
  </g>
</svg>
