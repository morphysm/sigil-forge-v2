    <path id="torso" d="M102 147 112 176"/>
    <path id="arms" d="M105 157 91 170 73 150 M106 159 127 158 138 182"/>
    <path id="robe" d="M112 176 142 185 156 204 173 213H89Z M141 195 149 204"/>
  </g>

  <g id="regalia" fill="none" stroke="#F8F4E7" stroke-width="3.5" stroke-linejoin="bevel">
