    <path d="M80 236V246 M154 236V246"/>
  </g>
  <path id="scepter" fill="none" stroke="#F8F4E7" stroke-width="3.5" stroke-linejoin="bevel" d="M70 118 75 162 M69 105 75 110 70 118 64 112Z"/>

  <g id="empress" fill="none" stroke="#00FF41" stroke-width="5" stroke-linejoin="bevel">
